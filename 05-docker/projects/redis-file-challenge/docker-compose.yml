version: '3.8'

services:
  web:
    build: "./Flask application"
    expose:
      - "5000"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  redis:
    image: redis-db
    volumes: 
    - redis-data:/data

  geoip:
    image: gsmlg/geoip2:embed
    ports:
    - "8000:8000"
    command: ["-addr", ":8000"]

  nginx:
    image: nginx:latest
    ports:
     - "5000:5000"
    volumes:
     - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
    - web
volumes:
  redis-data: